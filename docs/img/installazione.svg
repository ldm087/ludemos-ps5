<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 300" width="1040" height="300">
<defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5E97F6"/></marker></defs>
<rect width="1040" height="300" rx="20" fill="#0B0B0F"/>
<text x="32" y="44" font-size="20" font-weight="700" fill="#F2F2F5" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">Installazione senza hardware esterno</text>
<rect x="32" y="74" width="226" height="128" rx="14" fill="#16161C" stroke="#2E2E36" stroke-width="2"/><circle cx="54" cy="98" r="12" fill="#2F6FED"/><text x="54" y="103" text-anchor="middle" font-size="13" font-weight="700" fill="#fff" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">1</text><text x="74" y="104" font-size="16" font-weight="700" fill="#F2F2F5" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">PC di build</text><text x="50" y="130" font-size="13" fill="#A0A0AA" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">container LXC:</text><text x="50" y="149" font-size="13" fill="#A0A0AA" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">kernel, initrd,</text><text x="50" y="168" font-size="13" fill="#A0A0AA" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">sistema in pezzi + sha256</text><line x1="260" y1="138.0" x2="280" y2="138.0" stroke="#5E97F6" stroke-width="2.5" marker-end="url(#p)"/><rect x="282" y="74" width="226" height="128" rx="14" fill="#16161C" stroke="#2E2E36" stroke-width="2"/><circle cx="304" cy="98" r="12" fill="#2F6FED"/><text x="304" y="103" text-anchor="middle" font-size="13" font-weight="700" fill="#fff" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">2</text><text x="324" y="104" font-size="16" font-weight="700" fill="#F2F2F5" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">Memoria interna PS5</text><text x="300" y="130" font-size="13" fill="#A0A0AA" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">via FTP in /data/linux:</text><text x="300" y="149" font-size="13" fill="#A0A0AA" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">kernel + initrd</text><text x="300" y="168" font-size="13" fill="#A0A0AA" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">installatore</text><line x1="510" y1="138.0" x2="530" y2="138.0" stroke="#5E97F6" stroke-width="2.5" marker-end="url(#p)"/><rect x="532" y="74" width="226" height="128" rx="14" fill="#16161C" stroke="#2E2E36" stroke-width="2"/><circle cx="554" cy="98" r="12" fill="#2F6FED"/><text x="554" y="103" text-anchor="middle" font-size="13" font-weight="700" fill="#fff" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">3</text><text x="574" y="104" font-size="16" font-weight="700" fill="#F2F2F5" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">Fase 1: m2_init</text><text x="550" y="130" font-size="13" fill="#A0A0AA" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">tabella partizioni</text><text x="550" y="149" font-size="13" fill="#A0A0AA" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">sull'M.2 senza toccare</text><text x="550" y="168" font-size="13" fill="#A0A0AA" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">i metadati Sony</text><line x1="760" y1="138.0" x2="780" y2="138.0" stroke="#5E97F6" stroke-width="2.5" marker-end="url(#p)"/><rect x="782" y="74" width="226" height="128" rx="14" fill="#0F1A33" stroke="#2F6FED" stroke-width="2"/><circle cx="804" cy="98" r="12" fill="#2F6FED"/><text x="804" y="103" text-anchor="middle" font-size="13" font-weight="700" fill="#fff" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">4</text><text x="824" y="104" font-size="16" font-weight="700" fill="#F2F2F5" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">Fase 2: download</text><text x="800" y="130" font-size="13" fill="#A0A0AA" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">Wi-Fi, ripresa dopo</text><text x="800" y="149" font-size="13" fill="#A0A0AA" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">interruzioni (HTTP Range),</text><text x="800" y="168" font-size="13" fill="#A0A0AA" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">sha256, tar con xattr</text><text x="32" y="250" font-size="13" fill="#A0A0AA" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">Niente chiavetta USB, niente cavo di rete, niente tastiera: la rete Wi-Fi è già scritta nell'initrd e l'avanzamento è salvato sull'M.2.</text><text x="32" y="272" font-size="13" fill="#A0A0AA" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">Tutto il percorso è stato provato prima in QEMU (finto M.2 NVMe da 250 GB, rete USB emulata).</text></svg>